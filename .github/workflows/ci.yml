name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: incident_investigator_test
        ports:
          - 5432:5432
        # This is where that healthcheck proves its worth! 
        # GitHub Actions will wait until this healthcheck passes before running the Python tests.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Phase 1 Tests
      # We provide a fake Groq API key just so the app can boot up (the tests don't actually call the LLM API)
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/incident_investigator_test
        TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/incident_investigator_test
        GROQ_API_KEY: "test_key_does_not_need_to_be_real"
      run: |
        pytest tests/test_phase1.py -v
